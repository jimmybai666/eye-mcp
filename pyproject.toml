[project]
name = "eye-mcp"
version = "0.1.0"
description = "眼科AI MCP服务 - 提供OCT图像分割、中央凹定位、视杯视盘分割与杯盘比计算、视网膜动静脉血管分割、眼底四类病灶分割等工具"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.0.0,<2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pyyaml>=6.0.3",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.3",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "einops>=0.7.0",
    "huggingface-hub>=0.20.0",
]

[project.scripts]
eye-mcp = "eye_mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
